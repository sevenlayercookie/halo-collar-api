[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "halo-collar"
version = "0.1.0"
description = "Unofficial Python client for the reverse-engineered Halo Collar API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Halo Collar API contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=15,<17",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
halo = "halo_collar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_collar"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
